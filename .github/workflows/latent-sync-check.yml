name: Latent Sync Check

# Runs `node packages/cli/bin/latent.mjs verify --json` — sync figma,
# check-styles, check-parity (every component), and check-docs, all in one
# command — against every push the Latent Sync Figma plugin
# (packages/figma-plugin/) makes to figma-sync — so drift is reported as a
# check on the branch/PR the plugin already links to, instead of relying on
# someone remembering to run these locally after merging. Invokes the CLI
# directly, no reimplemented logic, so this can't silently drift from what
# the CLI actually checks. A human at the terminal runs the exact same
# `verify` command — see CLAUDE.md.

on:
  push:
    branches:
      - figma-sync

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: verify (sync figma + check-styles + check-parity + check-docs)
        run: node packages/cli/bin/latent.mjs verify --json
